name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Health e testes unitarios
    # requirements.txt inclui pywin32, que exige Windows.
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      # Valores ficticios: este CI nao chama provedores nem bancos de producao.
      GEMINI_API_KEY: ci-gemini-placeholder
      GROQ_API_KEY: ci-groq-placeholder
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/assessor_ci
      MONGODB_URI: mongodb://127.0.0.1:27017/assessor?serverSelectionTimeoutMS=5000
      QDRANT_API_KEY: ci-qdrant-placeholder
      QDRANT_CLUSTER_ENDPOINT: http://127.0.0.1:6333
      LANGSMITH_TRACING: "false"

    steps:
      - name: Checkout da aplicacao
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/requirements-ci.txt

      - name: Instalar todas as dependencias
        run: |
          python -m pip install -r requirements.txt -r .github/requirements-ci.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check

      - name: Iniciar MongoDB temporario
        run: ./.github/scripts/start-mongodb.ps1

      - name: Iniciar API e verificar /health
        run: python .github/scripts/check_health.py

      - name: Executar cinco testes unitarios
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Encerrar MongoDB temporario
        if: always()
        run: |
          if ($env:CI_MONGODB_PID) {
            Stop-Process -Id ([int]$env:CI_MONGODB_PID) -ErrorAction SilentlyContinue
          }
